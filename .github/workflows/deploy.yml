name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:
  # Fired by RM6785-ROM-post once a build has been published, so a new post
  # reaches the site without waiting for the nightly run.
  repository_dispatch:
    types: [records-updated]
  # Backstop, in case a dispatch is missed or the token expires.
  schedule:
    - cron: '41 4 * * *'

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # The committed submodule pointers are a floor for local development, not
      # the published state: production always builds the current tip of each
      # branch, so a new record needs no bump commit here.
      #
      # Not `git submodule update --remote`, which needs a remote-tracking ref
      # for each submodule's configured branch. actions/checkout only fetches the
      # commit a pointer names, so origin/tooling never exists — origin/main only
      # works by accident, being that repository's default branch. Fetch the
      # branch named in .gitmodules instead.
      - name: Update the vendored records and tooling to their branch tips
        run: |
          git submodule foreach '
            branch=$(git config -f "$toplevel/.gitmodules" "submodule.$name.branch" || true)
            git fetch --depth=1 origin "${branch:-HEAD}"
            git checkout --quiet FETCH_HEAD
          '

      - name: Install, build, and upload your site
        uses: withastro/action@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
